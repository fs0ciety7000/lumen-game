  #title h1, #end h1 { font-weight: 600; font-size: clamp(48px, 9vw, 120px); letter-spacing: .32em; margin: 0 0 0 .32em;
    text-shadow: 0 0 24px rgba(255, 190, 90, .55), 0 0 60px rgba(255, 160, 60, .25); }
  #title h2, #end h2 { font-weight: 400; font-style: italic; font-size: clamp(18px, 2.4vw, 30px); margin: .2em 0 2.4em; opacity: .85; letter-spacing: .08em; }
  .controls { font-size: clamp(14px, 1.5vw, 19px); letter-spacing: .12em; opacity: .75; }
  #title { justify-content: flex-start; padding-top: 12vh; }
  #end { opacity: 0; color: #fff3d8; justify-content: flex-end; align-items: flex-start; text-align: left; padding: 0 0 5vh 5vw; }
  #end h1 { font-size: clamp(28px, 3.5vw, 48px); margin: 0; } #end h2 { margin: .1em 0 .8em; font-size: clamp(15px, 1.6vw, 22px); }
  #end h1 { text-shadow: 0 0 30px rgba(255, 220, 160, .8); }
  #hud { opacity: 0; transition: opacity 1s; }

    background: radial-gradient(circle, #fff1c4 0%, #ffbe5c 35%, rgba(255, 150, 40, 0) 70%); }
  #dots { position: absolute; right: 30px; top: 26px; display: flex; gap: 12px; }
  #dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(160, 190, 210, .25); box-shadow: none; transition: all .8s; }
  #dots i.on { background: #ffd27a; box-shadow: 0 0 10px #ffb04a, 0 0 22px rgba(255, 170, 60, .6); }
  #fade { position: fixed; inset: 0; background: #010a12; opacity: 0; pointer-events: none; transition: opacity .7s; }

<body>
<div class="ui" id="title"><h1>LUMEN</h1><h2>The Lost Lighthouse</h2>
  <div class="controls">WASD / arrows to walk · hold Space to raise the lantern · Enter to begin</div></div>
<div class="ui" id="hud"><div id="energy"></div><div id="dots"><i></i><i></i><i></i><i></i></div></div>
<div class="ui" id="end"><h1>LUMEN</h1><h2>the lighthouse is lit</h2><div class="controls">R to walk again</div></div>
<div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
let seed = +(Q.get('seed') || 7);
const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---------- palette, measured on the video frames (study/study.json, f_001..f_041) ----------
const NIGHT = { fog: new THREE.Color(0x0a2c44), sky: new THREE.Color(0x022438), hemiTop: new THREE.Color(0x2d5a7a), hemiBot: new THREE.Color(0x0b1a14) };
const DAWN  = { fog: new THREE.Color(0xc98a58), sky: new THREE.Color(0xe8a060), hemiTop: new THREE.Color(0xffc890), hemiBot: new THREE.Color(0x5a3a28) };
const LANTERN = 0xffcf8a;

// ---------- renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(NIGHT.fog.clone(), 0.016);
scene.background = NIGHT.sky.clone();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 4000);

const hemi = new THREE.HemisphereLight(NIGHT.hemiTop.clone(), NIGHT.hemiBot.clone(), 0.55);
scene.add(hemi);
const moon = new THREE.DirectionalLight(0x6f98c0, 0.35);
moon.position.set(-20, 30, 10);
scene.add(moon);
const sun = new THREE.DirectionalLight(0xffc888, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 200 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------- post: bloom + one grade (lift teal shadows, warm highlights), vignette, grain, fade ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.35, 0.78);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uDawn: { value: 0 }, uVignette: { value: 0.55 }, uGrain: { value: 0.012 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uDawn; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(.299,.587,.114));
      vec3 nightShadow = vec3(.004,.03,.05), nightGain = vec3(1.02,1.0,.97);
      vec3 dawnShadow = vec3(.05,.025,.02), dawnGain = vec3(1.06,.98,.88);
      vec3 lift = mix(nightShadow, dawnShadow, uDawn), gain = mix(nightGain, dawnGain, uDawn);
      c = c * gain + lift * (1. - smoothstep(0., .5, l));
      c = mix(vec3(l), c, mix(1.05, 1.1, uDawn));
      c *= 1. - uVignette * smoothstep(.3, .95, length((vUv - .5) * vec2(1.15, 1.)) * 1.3);
      c += (h(vUv * 997. + fract(uTime) * 13.) - .5) * uGrain;
      gl_FragColor = vec4(c, 1.); }`,
});
composer.addPass(grade);
composer.addPass(new OutputPass());

// ---------- loading ----------
const gltf = new GLTFLoader();
const texL = new THREE.TextureLoader();
const loadG = url => new Promise((res, rej) => gltf.load(url, res, undefined, rej));
const loadT = url => new Promise((res, rej) => texL.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, rej));
const [heroG, lanternG, shadowG, islandG, islandLoG, lighthouseG, skyN, skyD, fernT, cloudT] = await Promise.all([
  loadG('assets/models/hero.glb'), loadG('assets/models/lantern.glb'), loadG('assets/models/shadow.glb'),
  loadG('assets/models/island.glb'), loadG('assets/models/island_lo.glb'), loadG('assets/models/lighthouse.glb'),
  loadT('assets/tex/sky_night.webp'), loadT('assets/tex/sky_dawn.webp'), loadT('assets/tex/ferns.webp'), loadT('assets/tex/clouds.webp'),
]);
cloudT.colorSpace = THREE.NoColorSpace;

// normalize a GLB: centered on x/z, base at y=0, scaled to a height (h) or width (w)
function fit(src, { h, w }) {
  const o = src.clone ? src.clone(true) : src;
  const box = new THREE.Box3().setFromObject(o), size = box.getSize(new THREE.Vector3());
  const s = h ? h / size.y : w / Math.max(size.x, size.z);
  o.scale.multiplyScalar(s);
  const b2 = new THREE.Box3().setFromObject(o), c = b2.getCenter(new THREE.Vector3());
  o.position.sub(new THREE.Vector3(c.x, b2.min.y, c.z));
  const g = new THREE.Group(); g.add(o); return g;
}
function softenMaterials(o, { rough = 1, metal = 0 } = {}) {
  o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true;
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    mats.forEach(mt => { mt.roughness = rough; mt.metalness = metal; mt.metalnessMap = null; mt.roughnessMap = null; mt.envMapIntensity = 0; }); } });
}

// ---------- sky: the two fal skies on a mirrored cylinder, cross-faded at dawn ----------
const skyMat = new THREE.ShaderMaterial({
  uniforms: { tN: { value: skyN }, tD: { value: skyD }, uDawn: { value: 0 }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tN, tD; uniform float uDawn, uTime; varying vec2 vUv;
    void main(){ float u = vUv.x * 3. + uTime * .002; u = 1. - abs(mod(u, 2.) - 1.);
      vec2 uv = vec2(u, clamp(vUv.y, .002, .998));
      vec3 n = texture2D(tN, uv).rgb, d = texture2D(tD, uv).rgb;
      n = pow(n, vec3(1.3)) * vec3(.45, .66, .95);
      vec3 c = mix(n, d * .85, uDawn);
      gl_FragColor = vec4(c, 1.);
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, depthWrite: false, fog: false,
});
const sky = new THREE.Mesh(new THREE.CylinderGeometry(1500, 1500, 2100, 72, 1, true), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// ---------- particles: one additive pool (sparks, motes), one normal pool (shadow smoke) ----------
class Pool {
  constructor(n, additive) {
    this.n = n; this.i = 0;
    this.p = new Float32Array(n * 3); this.v = new Float32Array(n * 3); this.c = new Float32Array(n * 3);
    this.life = new Float32Array(n); this.max = new Float32Array(n); this.size = new Float32Array(n); this.a = new Float32Array(n);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.BufferAttribute(this.c, 3));
    g.setAttribute('size', new THREE.BufferAttribute(this.size, 1));
    g.setAttribute('alpha', new THREE.BufferAttribute(this.a, 1));
    this.mat = new THREE.ShaderMaterial({
      uniforms: { uScale: { value: innerHeight * .5 } },
      vertexShader: `attribute float size, alpha; attribute vec3 color; varying vec3 vC; varying float vA; uniform float uScale;
        void main(){ vC = color; vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.);
          gl_PointSize = size * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying vec3 vC; varying float vA;
        void main(){ float d = length(gl_PointCoord - .5) * 2.; float a = ${additive ? 'pow(max(1. - d, 0.), 1.8)' : 'smoothstep(1., .2, d) * .8'};
          gl_FragColor = vec4(vC, a * vA); }`,
      transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    });
    this.points = new THREE.Points(g, this.mat); this.points.frustumCulled = false; scene.add(this.points);
  }
  emit(x, y, z, vx, vy, vz, life, size, col) {
    const i = this.i = (this.i + 1) % this.n, k = i * 3;
    this.p[k] = x; this.p[k + 1] = y; this.p[k + 2] = z; this.v[k] = vx; this.v[k + 1] = vy; this.v[k + 2] = vz;
    this.c[k] = col.r; this.c[k + 1] = col.g; this.c[k + 2] = col.b; this.life[i] = life; this.max[i] = life; this.size[i] = size;
  }
  update(dt, t, drag = 1.2) {
    const f = Math.exp(-drag * dt);
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.a[i] = 0; continue; }
      this.life[i] -= dt; const k = i * 3, r = this.life[i] / this.max[i];
      this.v[k] *= f; this.v[k + 2] *= f; this.v[k + 1] = this.v[k + 1] * f + 0.12 * dt;
      this.p[k] += (this.v[k] + Math.sin(t * 1.7 + i) * .15) * dt; this.p[k + 1] += this.v[k + 1] * dt; this.p[k + 2] += this.v[k + 2] * dt;
      this.a[i] = Math.min(1, (1 - r) * 6) * Math.min(1, r * 2.5) * (.7 + .3 * Math.sin(t * 9 + i * 7.1));
    }
    const at = this.points.geometry.attributes;
    at.position.needsUpdate = at.color.needsUpdate = at.size.needsUpdate = at.alpha.needsUpdate = true;
  }
}
const glow = new Pool(3500, true), smoke = new Pool(900, false);
const GOLD = new THREE.Color(1.6, 1.05, .45), GOLD2 = new THREE.Color(1.4, .8, .3), DARK = new THREE.Color(.03, .02, .06), VIOLET = new THREE.Color(.9, .5, 1.6);

// ---------- cloud sea: fal cloud atlas on camera-facing instanced quads ----------
const CLOUDS = 260;
const cg = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
const cOff = new Float32Array(CLOUDS * 3), cScale = new Float32Array(CLOUDS * 2), cCell = new Float32Array(CLOUDS);
for (let i = 0; i < CLOUDS; i++) {
  const far = i < 200;
  const x = (rand() - .5) * (far ? 900 : 260), z = 60 - rand() * (far ? 700 : 260), y = far ? -34 - rand() * 30 : -20 - rand() * 14;
  cOff.set([x, y, z], i * 3); const s = far ? 40 + rand() * 70 : 18 + rand() * 26; cScale.set([s, s * (.45 + rand() * .2)], i * 2); cCell[i] = Math.floor(rand() * 3);
}
cg.setAttribute('iOff', new THREE.InstancedBufferAttribute(cOff, 3));
cg.setAttribute('iScale', new THREE.InstancedBufferAttribute(cScale, 2));
cg.setAttribute('iCell', new THREE.InstancedBufferAttribute(cCell, 1));
cg.instanceCount = CLOUDS;
const cloudMat = new THREE.ShaderMaterial({
  uniforms: { tC: { value: cloudT }, uFog: { value: NIGHT.fog.clone() }, uLit: { value: new THREE.Color(0x1f4c66) }, uDark: { value: new THREE.Color(0x05192a) },
    uDensity: { value: .006 }, uTime: { value: 0 }, uGlow: { value: 0 } },
  vertexShader: `attribute vec3 iOff; attribute vec2 iScale; attribute float iCell; uniform float uTime; varying vec2 vUv; varying float vDepth;
    void main(){ vec3 o = iOff + vec3(sin(uTime * .05 + iOff.z) * 4., 0., 0.);
      vec4 mv = modelViewMatrix * vec4(o, 1.); mv.xy += position.xy * iScale;
      float c = iCell; vUv = (uv + vec2(mod(c, 2.), 1. - floor(c / 2.))) * .5; vUv.y = vUv.y; vDepth = -mv.z;
      gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform sampler2D tC; uniform vec3 uFog, uLit, uDark; uniform float uDensity, uGlow; varying vec2 vUv; varying float vDepth;
    void main(){ float l = texture2D(tC, vUv).r; float a = smoothstep(.0, .75, l) * .8;
      vec3 col = mix(uDark, uLit, .35 + .65 * l) + uGlow * vec3(.3,.18,.05) * l;
      float f = 1. - exp(-pow(uDensity * vDepth, 2.)); col = mix(col, uFog, f * .85);
      gl_FragColor = vec4(col, a * .9); if (gl_FragColor.a < .01) discard;
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false,
});
const clouds = new THREE.Mesh(cg, cloudMat); clouds.frustumCulled = false; clouds.renderOrder = -5; if (!Q.has('noclouds')) scene.add(clouds);

// ---------- islands ----------
const islandProto = fit(islandG.scene, { w: 1 });
softenMaterials(islandProto);
islandProto.traverse(m => { if (m.isMesh) { m.material.color.setRGB(.9, .95, .85); m.castShadow = false; } });
const islandLo = fit(islandLoG.scene, { w: 1 });
softenMaterials(islandLo);
islandLo.traverse(m => { if (m.isMesh) { m.material.color.setRGB(.9, .95, .85); m.castShadow = false; } });
const down = new THREE.Raycaster(); down.ray.direction.set(0, -1, 0);
function topOf(obj, x = 0, z = 0) {
  obj.updateMatrixWorld(true); const wp = obj.getWorldPosition(new THREE.Vector3());
  down.ray.origin.set(wp.x + x, wp.y + 1000, wp.z + z); const h = down.intersectObject(obj, true)[0];
  return h ? h.point.y : wp.y;
}
function makeIsland(d, x, top, z, rotY = 0, proto = islandProto) {
  const g = proto.clone(true); g.scale.setScalar(d); g.rotation.y = rotY; g.position.set(x, 0, z); scene.add(g);
  g.position.y = top - topOf(g); g.updateMatrixWorld(true); return g;
}

// level: start, four islands held by shadows, the beacon island, the lighthouse beyond
const LEVEL = [
  { x: 0, y: 0, z: 0, d: 10, n: 0 },
  { x: 1.5, y: .6, z: -17, d: 10.5, n: 3 },
  { x: -3.5, y: 1.3, z: -33, d: 11, n: 4 },
  { x: 2.5, y: .7, z: -50, d: 12, n: 5 },
  { x: -.5, y: 1.6, z: -67, d: 12.5, n: 6 },
  { x: 0, y: 2.2, z: -83, d: 10, n: 0, beacon: true },
];
const walkable = [];
const islands = LEVEL.map((L, i) => {
  const mesh = makeIsland(L.d, L.x, L.y, L.z, rand() * 6.28);
  walkable.push(mesh);
  const light = new THREE.PointLight(0xffb85a, 0, L.d * 1.3, 1.6); light.position.set(L.x, L.y + 2.2, L.z); scene.add(light);
  // a warm glow spreading over the grass once the island is lit
  const disc = new THREE.Mesh(new THREE.CircleGeometry(L.d * .5, 48), new THREE.ShaderMaterial({
    uniforms: { uA: { value: 0 }, uR: { value: 0 }, uTime: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: `uniform float uA, uR, uTime; varying vec2 vUv;
      void main(){ float d = length(vUv - .5) * 2.; float edge = smoothstep(uR, uR - .25, d);
        float ring = smoothstep(.12, 0., abs(d - uR)) * step(.01, uR) * (1. - smoothstep(.9, 1., uR));
        vec3 c = vec3(1., .62, .22) * (edge * pow(1. - d * .8, 2.) * .3 + ring * .8);
        gl_FragColor = vec4(c * uA, 1.); }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4,
  }));
  disc.rotation.x = -Math.PI / 2; disc.position.set(L.x, L.y + .06, L.z); scene.add(disc);
  return { ...L, i, mesh, light, disc, cleared: L.n === 0, litT: L.n === 0 ? 1 : 0, shadows: [], ferns: [] };
});

// stepping stones between islands, rising when the island before them is lit
const bridges = [];
for (let i = 0; i < islands.length - 1; i++) {
  const A = islands[i], B = islands[i + 1];
  const a = new THREE.Vector3(A.x, A.y, A.z), b = new THREE.Vector3(B.x, B.y, B.z), dir = b.clone().sub(a);
  const len = Math.hypot(dir.x, dir.z); dir.y = 0; dir.normalize();
  const s0 = A.d * .5 - .9, s1 = len - B.d * .5 + .9, n = Math.ceil((s1 - s0) / 1.55);
  const stones = [];
  for (let k = 0; k <= n; k++) {
    const t = s0 + (s1 - s0) * k / n, f = t / len;
    const p = a.clone().addScaledVector(dir, t); const top = lerp(A.y, B.y, f) - .05;
    const side = Math.sin(k * 1.9 + i) * .35;
    const st = makeIsland(2.3 + rand() * .4, p.x + dir.z * side, top, p.z - dir.x * side, rand() * 6.28, islandLo);
    st.userData = { top: st.position.y, delay: k * .12 };
    st.visible = false; stones.push(st);
  }
  bridges.push({ stones, risen: false, t: 0 });
}
function raiseBridge(i, instant) {
  const B = bridges[i]; if (!B || B.risen) return; B.risen = true; B.t = instant ? 99 : 0;
  B.stones.forEach(s => { s.visible = true; if (!instant) s.position.y = s.userData.top - 7; });
  if (!instant) sfx('bridge', .8);
}

// far islands, some upside down like the floating rocks hanging in the video's sky
const farIslands = [];
for (let i = 0; i < 20; i++) {
  const side = i % 2 ? 1 : -1, z = 10 - rand() * 330, x = side * (40 + rand() * 130), up = rand() < .3;
  const g = islandLo.clone(true); g.scale.setScalar(5 + rand() * 16);
  g.position.set(x, up ? 26 + rand() * 30 : -14 + rand() * 22, z); g.rotation.set(up ? Math.PI : 0, rand() * 6.28, (rand() - .5) * .2);
  g.traverse(m => { if (m.isMesh) { m.castShadow = false; } });
  scene.add(g); farIslands.push(g);
}

// ---------- lighthouse ----------
const lighthouse = fit(lighthouseG.scene, { h: 66 });
softenMaterials(lighthouse);
lighthouse.traverse(m => { if (m.isMesh) m.castShadow = false; });
lighthouse.position.set(0, -18, -190);
scene.add(lighthouse);
const lampPos = new THREE.Vector3(0, -18 + 66 * .86, -190);
const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.6, 24, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.2, 1.1), fog: false }));
lamp.position.copy(lampPos); scene.add(lamp);
const lampLight = new THREE.PointLight(0xffc070, 0, 260, 1.1); lampLight.position.copy(lampPos); scene.add(lampLight);
// god rays fanning out of the lamp
const rays = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.ShaderMaterial({
  uniforms: { uA: { value: 0 }, uTime: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform float uA, uTime; varying vec2 vUv;
    float n(float x){ return fract(sin(x * 91.7) * 4375.85); }

      if (onIsland && d < 7.5) { tx = S.pos.x; tz = S.pos.z; spd = .85 / Math.sqrt(s.h); }

      if (vl > .95) { const nx = p.x + vx / vl * spd * dt, nz = p.z + vz / vl * spd * dt; const h = heightAt(nx, nz, p.y); if (h !== null) { p.x = nx; p.z = nz; p.y = THREE.MathUtils.damp(p.y, h, 10, dt); } }
      s.g.rotation.y = Math.atan2(dx, dz);
      const b = Math.sin(now * 3 + s.phase); s.g.scale.set(s.h * (1 + b * .04), s.h * (1 - b * .05), s.h * (1 + b * .04));
      s.eyes.forEach(e => e.scale.setScalar(.12 * (Math.sin(now * .7 + s.phase * 3) > .97 ? .2 : 1)));
      if (rand() < dt * 6) smoke.emit(p.x + (rand() - .5) * .6 * s.h, p.y + rand() * .8 * s.h, p.z + (rand() - .5) * .6 * s.h, 0, .25, 0, 1.6, .5 * s.h, DARK);
      s.hitCd -= dt;
      if (d < .85 && s.hitCd <= 0 && S.fadeT < 0) {
        s.hitCd = 1.4; S.energy -= .3; S.shake = .35; sfx('dissolve', .5, .6);
        const kx = dx / (d || 1), kz = dz / (d || 1); S.vel.x += kx * 6; S.vel.z += kz * 6;
        for (let k = 0; k < 25; k++) smoke.emit(S.pos.x, S.pos.y + .6, S.pos.z, (rand() - .5) * 2, rand(), (rand() - .5) * 2, 1, .35, DARK);
        if (S.energy <= 0) { S.energy = 0; S.fadeT = 0; $('fade').style.opacity = 1; }
      }
    }
    if (loops.whisper) loops.whisper.g.gain.value = THREE.MathUtils.damp(loops.whisper.g.gain.value, S.dawnT < 0 ? clamp(1 - nearest / 9, 0, 1) * .5 : 0, 3, dt);

    // the light went out: fade, wake on the last lit island
    if (S.fadeT >= 0) { S.fadeT += dt; if (S.fadeT > .9 && S.fadeT - dt <= .9) { placeAt(S.lastSafe); S.snap = true; S.energy = 1; shadows.forEach(s => { if (s.alive && s.dying < 0) s.g.position.copy(s.home); }); }
      if (S.fadeT > 1.3) { S.fadeT = -1; $('fade').style.opacity = 0; } }

    // ending: the beacon ring, then dawn
    beaconRing.material.opacity = islands.slice(1, 5).every(I => I.cleared) && S.dawnT < 0 ? .5 + .4 * Math.sin(now * 3) : 0;
    if (S.dawnT >= 0) {
      S.dawnT += dt; S.dawn = clamp((S.dawnT - .6) / 5, 0, 1);
      if (S.dawnT > 2.2 && current !== clips.Victory_Cheer) play('Victory_Cheer', .4);
      if (S.dawnT > 7 && S.phase === 'play') { S.phase = 'end'; $('end').style.opacity = 1; $('hud').style.opacity = 0; }
    }
  }
  if (S.phase === 'end') S.dawnT += dt;

  // pulse ring
  if (S.pulse) {
    const P = S.pulse; P.t += dt; const k = Math.min(1, P.t / P.dur), r = P.R * (1 - Math.pow(1 - k, 3));
    ring.visible = true; ring.position.set(P.x, P.y + .07, P.z); ring.scale.setScalar(r + .5);
    ringMat.uniforms.uR.value = r / (r + .5); ringMat.uniforms.uA.value = 1 - Math.pow(Math.max(0, (P.t - P.dur * .6) / (P.dur * 1.2)), 1.5);
    for (const s of shadows) if (s.alive && s.dying < 0 && Math.hypot(s.g.position.x - P.x, s.g.position.z - P.z) < r + .4 * s.h) {
      s.dying = 0; s.alive = false; sfx('dissolve', .7, .9 + rand() * .3);
      const p = s.g.position; for (let q = 0; q < 70; q++) glow.emit(p.x + (rand() - .5) * .8, p.y + rand() * s.h, p.z + (rand() - .5) * .8, (rand() - .5) * 1.5, .5 + rand() * 1.5, (rand() - .5) * 1.5, 1.2 + rand() * 1.5, .07 + rand() * .09, rand() < .5 ? GOLD : VIOLET);
      for (let q = 0; q < 30; q++) smoke.emit(p.x, p.y + rand() * s.h, p.z, (rand() - .5) * 2, rand() * 1.5, (rand() - .5) * 2, 1, .45 * s.h, DARK);
    }
    if (P.t > P.dur * 1.8) { S.pulse = null; ring.visible = false; }
  }

  // islands light up
  islands.forEach(I => {
    if (I.cleared && I.litT < 1) I.litT = Math.min(1, I.litT + dt / 2.2);
    const l = ease(I.litT);
    I.light.intensity = l * (I.beacon ? 4 : 7) * (1 - S.dawn * .5);
    I.disc.material.uniforms.uA.value = (I.i === 0 ? .4 : 1) * l * (1 - S.dawn * .4); I.disc.material.uniforms.uR.value = Math.min(1, I.litT * 1.25);
    if (I.cleared && rand() < dt * (S.dawn > 0 ? 4 : 10)) { const a = rand() * 6.28, r = I.d * .5 * (.6 + rand() * .4);
      glow.emit(I.x + Math.cos(a) * r, I.y + rand() * .6, I.z + Math.sin(a) * r, 0, .2 + rand() * .3, 0, 2.5 + rand() * 2, .06 + rand() * .06, GOLD); }
  });
  bridges.forEach(B => { if (!B.risen) return; B.t += dt; B.stones.forEach(s => {
    const k = clamp((B.t - s.userData.delay) / 1.1, 0, 1); s.position.y = s.userData.top - 7 * Math.pow(1 - k, 3);
    if (k >= 1 && !walkable.includes(s)) walkable.push(s); }); });
  updateFerns(now);

  // hero animation + lantern in her right hand
  mixer.update(dt);
  if (S.castT > 0) { S.castT -= dt; if (S.castT <= 0 && S.dawnT < 0) current = null; }
  if (!(S.castT > 0) && S.dawnT < 0) play(moving ? 'Walking_Woman' : 'Idle', .25);
  if (clips.Walking_Woman) clips.Walking_Woman.timeScale = 1.15;
  hero.updateMatrixWorld(true);
  if (rightHand) rightHand.getWorldPosition(tmp); else tmp.set(S.pos.x + .3, S.pos.y + .6, S.pos.z);
  const lift = S.charging ? S.charge * .25 : 0;
  lantern.position.set(tmp.x, tmp.y - .3 + lift, tmp.z);
  lantern.rotation.set(Math.sin(now * 2.2) * .08 - S.vel.z * .05, hero.rotation.y, Math.sin(now * 1.7) * .06 + S.vel.x * .05);
  flame.position.set(tmp.x, tmp.y - .19 + lift, tmp.z);
  flameGlow.position.copy(flame.position);
  const flick = 1 + Math.sin(now * 13) * .05 + Math.sin(now * 23.7) * .04;
  const pulseBoost = S.pulse ? Math.max(0, 1 - S.pulse.t / (S.pulse.dur * 1.5)) * 50 : 0;
  lanternLight.position.copy(flame.position).y += .1;
  lanternLight.intensity = (4 + 7 * S.energy + S.charge * 16 + pulseBoost) * flick * (1 - S.dawn * .6) * (S.fadeT >= 0 ? 0 : 1);
  lanternLight.distance = 7 + 9 * S.energy + S.charge * 6 + (S.pulse ? S.pulse.R : 0);
  flameGlow.scale.setScalar((.35 + .3 * S.energy + S.charge * .9) * flick);
  chargeAura.position.copy(flame.position); chargeAura.scale.setScalar(.8 + S.charge * 1.6); chargeAura.material.opacity = S.charge * .45;
  $('energy').style.opacity = .25 + .75 * S.energy; $('energy').style.transform = `scale(${.6 + .4 * S.energy + S.charge * .3})`;

  // dawn: sky, fog, light, grade
  const D = ease(S.dawn);
  skyMat.uniforms.uDawn.value = D; grade.uniforms.uDawn.value = D;
  scene.fog.color.copy(NIGHT.fog).lerp(DAWN.fog, D); scene.fog.density = lerp(.016, .0052, D);
  scene.background.copy(NIGHT.sky).lerp(DAWN.sky, D);
  hemi.color.copy(NIGHT.hemiTop).lerp(DAWN.hemiTop, D); hemi.groundColor.copy(NIGHT.hemiBot).lerp(DAWN.hemiBot, D); hemi.intensity = lerp(.55, .75, D);
  sun.intensity = D * 1.8; sun.position.set(S.pos.x + 4, S.pos.y + 22, S.pos.z - 40); sun.target.position.copy(S.pos);
  moon.intensity = .35 * (1 - D);
  cloudMat.uniforms.uFog.value.copy(scene.fog.color); cloudMat.uniforms.uDensity.value = lerp(.0055, .0035, D);
  cloudMat.uniforms.uLit.value.set(0x1f4c66).lerp(new THREE.Color(0xffd3a0), D); cloudMat.uniforms.uDark.value.set(0x05192a).lerp(new THREE.Color(0xa86a4a), D);
  const igniteK = S.dawnT >= 0 ? clamp(S.dawnT / 1.2, 0, 1) : 0;
  lamp.material.color.setRGB(1, .7, .35).multiplyScalar(.6 + 3.5 * igniteK + (S.dawnT < 0 ? Math.max(0, Math.sin(now * 1.3)) * .8 : 0));
  lampLight.intensity = igniteK * 900;
  rays.material.uniforms.uA.value = igniteK * (.35 + .3 * D); rays.lookAt(camera.position);
  bloom.strength = lerp(.55, .6, D); bloom.threshold = lerp(.78, .88, D); renderer.toneMappingExposure = lerp(1.15, .78, D);
  if (S.dawn > 0 && rand() < dt * 60) glow.emit(S.pos.x + (rand() - .5) * 60, S.pos.y + rand() * 30, S.pos.z - 10 - rand() * 60, 0, .1, 0, 5, .25 + rand() * .35, GOLD);

  // camera: behind and above, like the video; at dawn it settles low to frame the lighthouse
  const shake = S.shake > 0 ? (S.shake -= dt, S.shake) : 0;
  const cd = clamp(Q.get('camd') ? +Q.get('camd') : 7.4, 3, 40);
  const want = tmp.set(S.pos.x * .7, S.pos.y + cd * .36, S.pos.z + cd);
  const look = new THREE.Vector3(S.pos.x * .85, S.pos.y + .9, S.pos.z - 5);
  if (S.dawnT >= 0) { const k = ease(clamp((S.dawnT - .3) / 4, 0, 1)); want.lerp(new THREE.Vector3(S.pos.x, S.pos.y + 3.4, S.pos.z + 9.5), k); look.lerp(new THREE.Vector3(lampPos.x, S.pos.y + 9, lampPos.z), k); }
  if (S.phase === 'title') { want.set(S.pos.x + Math.sin(now * .1) * 2, S.pos.y + 4.5, S.pos.z + 9); look.set(S.pos.x, S.pos.y + 1.5, S.pos.z - 10); }
  if (S.snap) { camPos.copy(want); camLook.copy(look); S.snap = false; }
  camPos.lerp(want, 1 - Math.exp(-3 * dt)); camLook.lerp(look, 1 - Math.exp(-4 * dt));
  camera.position.copy(camPos); camera.position.x += (rand() - .5) * shake * .25; camera.position.y += (rand() - .5) * shake * .25;
  camera.lookAt(camLook);
  sky.position.set(camera.position.x, 120, camera.position.z);

  glow.update(dt, now); smoke.update(dt, now, .8);
  const tt = now; [skyMat, ringMat, cloudMat, rays.material].forEach(m => m.uniforms.uTime && (m.uniforms.uTime.value = tt));
  grade.uniforms.uTime.value = now;
  if (Q.has('nopost')) renderer.render(scene, camera); else composer.render();
  if (!MANUAL) requestAnimationFrame(() => frame());
}
window.__step = (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) frame(dt); return window.__game.state; };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  glow.mat.uniforms.uScale.value = smoke.mat.uniforms.uScale.value = innerHeight * .5;
});
camLook.set(0, 1, -10);
const HIDE = (Q.get('hide') || '').split(',');
const groups = { far: farIslands, ferns: fernMeshes, shadows: shadows.map(s => s.g), lighthouse: [lighthouse, lamp, rays], sky: [sky], hero: [hero], lantern: [lantern, flame, flameGlow, chargeAura],
  glow: [glow.points, smoke.points], islands: islands.map(i => i.mesh), discs: islands.map(i => i.disc), stones: bridges.flatMap(b => b.stones), clouds: [clouds] };
HIDE.forEach(h => (groups[h] || []).forEach(o => { o.visible = false; o.userData.hidden = true; }));
frame();
</script>
